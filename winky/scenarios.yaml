    - "[blush] {user}, appreciate all the hearts and support!"

# Живые фолбэки: когда LLM недоступен или лимит (НИКАКОГО СПАМА В ШАПКУ ПРОФИЛЯ!)
fallbacks:
  ru:
    - "[happy] Ух, чатик сегодня летит так быстро, что я едва успеваю читать! Кто согласен — накидайте тапов!"
    - "[wink] Классная мысль! Чат, а вы что думаете по этому поводу? Напишите свои мысли в комменты!"
    - "[excited] Ого, интересная тема! Ребятки в чате, кто тоже так считает — ставьте плюсики!"
    - "[thinking] Смотрю сейчас прямо на свечу на графике, движение очень интересное! Следите за экраном!"
  en:
    - "[happy] Wow, the chat is moving so fast right now! Tap the screen if you agree!"
    - "[wink] Great thought! Chat, what do you think about that? Drop your opinion!"
    - "[excited] That's super interesting! Drop a plus in chat if you feel the same way!"
    - "[thinking] Keeping my eyes on this chart setup right now, looking very interesting!"
