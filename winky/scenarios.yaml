# ============================================================
# Реплики Winky — редактируйте на ходу, файл перезагрузится сам.
# Поля: id (уникальный), label (кнопка на пульте), lang (ru|en),
# emotion (idle|happy|excited|thinking|wink), text (что сказать).
# Цензура: реплики со стоп-словами (гарантия, 100%, без риска…)
# не озвучиваются — об этом будет предупреждение в пульте.
# ============================================================

quick_replies:
  # ---------- Русские ----------
  - id: greet_ru
    label: 👋 Приветствие
    lang: ru
    emotion: wave
    text: >-
      Привет-привет! Я Винки — неоновая помощница Wink Trade! Пока вы здесь смотрите,
      наш бот уже раздаёт торговые сигналы. Ссылка — в шапке профиля, залетайте!

  - id: cta_ru
    label: 🚀 Призыв (CTA)
    lang: ru
    emotion: happy
    text: >-
      Кстати, ребят! Прямо сейчас в боте Wink Trade можно получить сигнал —
      ссылка в шапке профиля. Зарегистрируйтесь и внесите депозит — и приложение с сигналами откроется автоматически!

  - id: howto_ru
    label: 📖 Как пользоваться
    lang: ru
    emotion: thinking
    text: >-
      Всё проще простого! Переходите по ссылке из шапки профиля — бот даст персональную
      ссылку на регистрацию в Pocket Option. Регистрируетесь, вносите депозит от десяти долларов —
      и бот сам открывает доступ к сигналам. Буквально пара минут!

  - id: questions_ru
    label: 💬 Вопросы в чат
    lang: ru
    emotion: wink
    text: >-
      Если есть вопросы — пишите прямо в чат, я всё вижу и обязательно отвечу!
      А ещё у бота есть поддержка в Telegram — кнопка прямо в меню.

  - id: stream_promo_ru
    label: 🎥 Про стрим
    lang: ru
    emotion: excited
    text: >-
      Сегодня прямо на этом стриме покажу, как бот выдаёт сигналы вживую!
      Смотрите на экран — сейчас будет сигнальная карточка. Ну как, впечатляет?

  # ---------- English ----------
  - id: greet_en
    label: 👋 Greeting
    lang: en
    emotion: excited
    text: >-
      Hey-hey! I'm Winky, the neon assistant of Wink Trade! While you're watching here,
      our bot is already dropping trading signals. The link is in the bio — hop in!

  - id: cta_en
    label: 🚀 Call to action
    lang: en
    emotion: happy
    text: >-
      By the way, guys! Right now you can grab a signal in the Wink Trade bot —
      the link is in the bio. Register, make a deposit — and the signals app unlocks automatically!

  - id: howto_en
    label: 📖 How to use
    lang: en
    emotion: thinking
    text: >-
      Super simple! Follow the link in the bio — the bot gives you a personal
      registration link for Pocket Option. Sign up, deposit from ten dollars —
      and the bot unlocks the signals app for you. Takes just a couple of minutes!

  - id: questions_en
    label: 💬 Ask in chat
    lang: en
    emotion: wink
    text: >-
      Got questions? Drop them right in the chat — I see everything and I'll answer!
      The bot also has support in Telegram — the button is right in its menu.

# Ротация призывов: Winky сама напоминает про бота каждые N минут
cta:
  interval_minutes: 4
  messages_ru:
    - "Напоминаю: ссылка на бота — в шапке профиля! Регистрируйтесь, пока раздаём сигналы."
    - "Ребят, вы ещё не в Wink Trade? Серьёзно?! Ссылка в шапке — ждём вас!"
    - "Хотите такие же сигналы, как на экране? Бот ждёт: ссылка в шапке профиля!"
    - "Кстати, доступ к сигналам открывается автоматически после депозита — попробуйте!"
  messages_en:
    - "Reminder: the bot link is in the bio! Hop in while we're dropping signals."
    - "Guys, you're still not in Wink Trade? Seriously?! The link is in the bio!"
    - "Want the same signals you see on screen? The bot is waiting — link in the bio!"
    - "By the way, access unlocks automatically after a deposit — give it a try!"

# Ответы по ключевым словам (приоритетнее LLM). Плейсхолдер {user} — ник зрителя.
keyword_replies:
  - id: kw_hello
    keywords: ["привет", "хай", "здаров", "добрый", "hello", "hi", "hey", "салют"]
    emotion: happy
    text_ru: "Привет-привет, {user}!! Рада тебя видеть!"
    text_en: "Hey-hey {user}!! So happy you're here!"

  - id: kw_howto
    keywords: ["как польз", "как зарег", "как нач", "как попасть", "how to", "how do i", "how can i"]
    emotion: thinking
    text_ru: >-
      Всё просто, {user}: жмёшь ссылку в шапке профиля, регистрируешься в Pocket Option
      по персональной ссылке от бота, вносишь депозит от десяти долларов — и сигналы открываются сами!
    text_en: >-
      Super simple, {user}: follow the link in the bio, register in Pocket Option
      via the bot's personal link, deposit from ten dollars — and the signals unlock automatically!

  - id: kw_link
    keywords: ["ссылк", "где бот", "как найти", "link", "where bot", "bio"]
    emotion: excited
    text_ru: "Ссылка на бота — прямо в шапке профиля, {user}! Бегом, пока раздаём сигналы!"
    text_en: "The bot link is right in the bio, {user}! Hurry up, we're dropping signals!"

  - id: kw_deposit
    keywords: ["депозит", "сколько внос", "сколько нужно", "пополн", "deposit", "how much"]
    emotion: thinking
    text_ru: "Депозит — любая сумма от десяти долларов, {user}. Больше ничего не нужно!"
    text_en: "Any deposit from ten dollars, {user}. Nothing else needed!"

  - id: kw_signal
    keywords: ["сигнал", "точност", "какой парам", "signal", "accuracy", "which pair"]
    emotion: excited
    text_ru: >-
      Сигналы по куче пар, {user}, точность до девяноста трёх процентов!
      Сама увидишь на экране — сейчас покажем!
    text_en: >-
      Signals on tons of pairs, {user}, accuracy up to ninety-three percent!
      You'll see it on screen right now!

  - id: kw_scam
    keywords: ["скам", "развод", "обман", "фейк", "scam", "fake", "fraud"]
    emotion: wink
    text_ru: >-
      Понимаю сомнения, {user}! Всё прозрачно: смотри работу бота вживую прямо сейчас —
      реальный телефон, реальные сигналы. И поддержка в боте на связи.
    text_en: >-
      I hear you, {user}! It's all transparent: watch the bot live right now —
      real phone, real signals. And the bot's support is one tap away.

  - id: kw_bot
    keywords: ["бот", "bot", "wink", "винк"]
    emotion: happy
    text_ru: "Всё про бота — в шапке профиля, {user}! Жми ссылку и залетай!"
    text_en: "Everything about the bot is in the bio, {user}! Tap the link and hop in!"

# Приветствия новых зрителей (событие входа в эфир). Плейсхолдер {user}.
greetings:
  ru:
    - "Оо, {user} у нас! Привет-привет!"
    - "Заходит {user} — располагайся, сейчас будет интересно!"
    - "Привет, {user}! Тебя ждут сигналы, лови волну!"
  en:
    - "Oh, {user} is here! Hey-hey!"
    - "{user} just joined — get comfy, it's about to get good!"
    - "Hi {user}! Signals incoming, catch the wave!"

# Благодарности за подарки. Плейсхолдеры {user} и {gift}.
gift_thanks:
  ru:
    - "Огромное спасибо, {user}, за {gift}!! Ты просто космос! 💚"
    - "Вау, {gift} от {user}! Спасибо огромное, очень приятно!"
    - "{user}, спасибо за {gift}! Ты делаешь стрим ярче!"
  en:
    - "Huge thanks, {user}, for the {gift}!! You're amazing! 💚"
    - "Wow, {gift} from {user}! Thank you so much!"
    - "{user}, thanks for the {gift}! You make the stream brighter!"

# Фолбэки: LLM недоступен или лимит — общий живой ответ. Плейсхолдер {user}.
fallbacks:
  ru:
    - "Хороший вопрос, {user}! Всё по шагам расскажет бот — ссылка в шапке!"
    - "Слышу тебя, {user}! Подробности — в шапке профиля, залетай!"
    - "Отлично спросил, {user}! Смотри на экран — сейчас всё покажу!"
  en:
    - "Great question, {user}! The bot explains everything — link in the bio!"
    - "I hear you, {user}! Details are in the bio, hop in!"
    - "Nice one, {user}! Watch the screen — I'll show you everything!"
