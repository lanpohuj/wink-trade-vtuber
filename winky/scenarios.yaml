# ============================================================
# Реплики Winky — редактируйте на ходу, файл перезагрузится сам.
# Формат quick_replies:
#   id: уникальный идентификатор
#   label: название в пульте
#   icon: эмодзи иконка
#   emotion: idle | happy | excited | thinking | wink | wave | win
#   texts_ru: список вариантов на русском (выбирается случайно)
#   texts_en: список вариантов на английском (выбирается случайно)
# ============================================================

quick_replies:
  - id: greeting
    label: Приветствие
    icon: 👋
    emotion: wave
    texts_ru:
      - "Привет-привет! Я Винки — неоновая помощница Wink! Рада всех видеть на стриме, сегодня тестируем крутые инструменты!"
      - "Хей, всем привет! Располагайтесь поудобнее, следите за экраном — сейчас всё покажу!"
    texts_en:
      - "Hey everyone! I'm Winky, your stream co-host! Welcome to the stream, we're testing awesome tools today!"
      - "Hello friends! Glad to see you all here, keep your eyes on the screen!"

  - id: how_to_use
    label: Как пользоваться
    icon: 📖
    emotion: thinking
    texts_ru:
      - "Всё очень просто! Переходи по ссылочке в шапке профиля, жми старт и следуй короткой инструкции на экране!"
      - "Инструкция буквально в три шага! Заходи по ссылке в описании профиля, бот всё наглядно покажет за пару минут!"
    texts_en:
      - "Super easy! Tap the link in the bio, hit start and follow the simple steps on screen!"
      - "Just three quick steps! Check the link in my profile bio, the assistant will guide you through!"

  - id: about_stream
    label: О стриме
    icon: 🎥
    emotion: excited
    texts_ru:
      - "На этом стриме мы тестируем веб-приложение аналитики в реальном времени! Смотрите на экран — вся статистика как на ладони!"
      - "В прямом эфире проверяем алгоритмы и смотрим за движением графиков! Задавайте вопросы в чате!"
    texts_en:
      - "On this stream we're testing real-time market analytics live! Check out the screen to see how it works!"
      - "Live testing our assistant and watching the charts right in front of you! Feel free to ask questions in chat!"

  - id: cta_bio
    label: Ссылка в био
    icon: 🚀
    emotion: happy
    texts_ru:
      - "Кстати, все полезные ссылки и доступ к приложению ждут вас прямо в шапке профиля! Не теряйте, заглядывайте!"
      - "Ребят, не забывайте заглянуть в шапку профиля — там закреплена прямая ссылочка, заходите!"
    texts_en:
      - "By the way, all helpful links and app access are right in my bio! Check it out!"
      - "Don't forget to tap the link in the profile bio, guys — everything is waiting there!"

  - id: ask_in_chat
    label: Вопросы в чат
    icon: 💬
    emotion: wink
    texts_ru:
      - "Если у вас есть любые вопросы по приложению или стриму — пишите прямо в чатик, я всё вижу и на всё отвечу!"
      - "Пишите свои вопросы и мысли в чат! С удовольствием пообщаюсь и подскажу, что к чему!"
    texts_en:
      - "Got any questions about the stream or app? Drop them in chat, I see everything and will gladly reply!"
      - "Feel free to ask anything in the chat, friends! I'm here to chat and help out!"

  - id: balance_info
    label: О доступе
    icon: ℹ️
    emotion: thinking
    texts_ru:
      - "Доступ к веб-приложению совершенно свободный, все подробности расписаны по шагам в боте по ссылке в профиле!"
      - "Чтобы открыть инструменты, просто выполните пару простых шагов в боте из шапки профиля. Это занимает буквально минуту!"
    texts_en:
      - "Access to the tools is super straightforward, check out the step-by-step guide via the link in bio!"
      - "To open the app, just complete a couple quick steps in the assistant linked in my profile!"

  - id: green_streak
    label: Зелёная серия
    icon: 🔥
    emotion: happy
    texts_ru:
      - "Ого, посмотрите на эту уверенную серию! Аналитика отрабатывает отлично, графики радуют глаз!"
      - "Вот это да, отличный результат на экране! Кто успел зайти вместе с нами — красавчики!"
    texts_en:
      - "Wow, look at that strong green streak! The analytics are on point today, looking beautiful!"
      - "What a fantastic result on screen! Cheers to everyone watching along!"

  - id: smart_pace
    label: Разумный темп
    icon: 🧠
    emotion: thinking
    texts_ru:
      - "Главное правило на стриме — холодная голова и строгая дисциплина. Никакой спешки, работаем спокойно и системно!"
      - "Никогда не торопитесь и держите эмоции под контролем! Системный подход всегда побеждает суету."
    texts_en:
      - "The number one rule is discipline and patience! Stay calm and stick to the plan."
      - "Never rush, guys! A calm, systematic approach always beats emotional impulse."

  - id: skeptics_reply
    label: Для сомневающихся
    icon: 🛡️
    emotion: wink
    texts_ru:
      - "Сомневаться — это абсолютно нормально! Поэтому мы и ведём открытый прямой эфир: смотрите, проверяйте сами вживую!"
      - "Лучшее доказательство — это открытый эфир и прозрачная статистика на экране. Наблюдайте своими глазами!"
    texts_en:
      - "It's totally normal to be skeptical! That's why we stream live — watch and see the transparent results for yourself!"
      - "The best proof is seeing it live right on your screen. Watch, verify, and decide for yourself!"

  - id: thanks_likes
    label: Лайки и поддержка
    icon: ❤️
    emotion: excited
    texts_ru:
      - "Огромное спасибо за ваши тапы по экрану и сердечки! Вы невероятная аудитория, это заряжает стрим!"
      - "Спасибо всем за лайки и поддержку стрима! Каждое сердечко помогает алгоритмам продвигать наш эфир!"
    texts_en:
      - "Thank you so much for the likes and screen taps! You guys are amazing, appreciate the support!"
      - "Huge thanks for all the hearts and likes! You're making this stream shine brighter!"

# Ротация призывов: Winky сама напоминает про бота каждые N минут
cta:
  interval_minutes: 4
  messages_ru:
    - "Напоминаю: ссылка на ассистента — в шапке профиля! Заходите, пока идёт стрим."
    - "Ребят, вы ещё не открыли приложение? Ссылка в шапке — ждём вас!"
    - "Хотите протестировать такие же инструменты, как на экране? Ссылка в шапке профиля!"
    - "Кстати, доступ к приложению открывается по простым шагам — попробуйте!"
  messages_en:
    - "Reminder: the assistant link is in the bio! Join while the stream is live."
    - "Guys, haven't checked the app yet? The link is in the bio!"
    - "Want to test the same tools you see on screen? Link is in the bio!"
    - "By the way, app access opens in just a few quick steps — give it a try!"

# Ответы по ключевым словам (приоритетнее LLM). Универсальные фразы для предкэширования.
keyword_replies:
  - id: kw_hello
    keywords: ["привет", "хай", "здаров", "добрый", "hello", "hi", "hey", "салют"]
    emotion: happy
    text_ru: "Привет-привет!! Очень рада тебя видеть!"
    text_en: "Hey-hey!! So happy you're here!"

  - id: kw_howto
    keywords: ["как польз", "как зарег", "как нач", "как попасть", "how to", "how do i", "how can i"]
    emotion: thinking
    text_ru: "Всё просто: переходишь по ссылке в шапке профиля, запускаешь бота и следуешь трём коротким шагам. Приложение откроется сразу!"
    text_en: "Super simple: tap the link in the bio, launch the assistant and follow 3 quick steps. The app opens right away!"

  - id: kw_link
    keywords: ["ссылк", "где бот", "как найти", "link", "where bot", "bio"]
    emotion: excited
    text_ru: "Ссылка на приложение — прямо в шапке профиля! Заглядывай, пока идёт эфир!"
    text_en: "The link is right in the bio! Hop in while the stream is live!"

  - id: kw_access
    keywords: ["доступ", "сколько нужно", "как открыть", "access", "how much", "cost"]
    emotion: thinking
    text_ru: "Все детали по доступу расписаны в боте по ссылке в шапке профиля. Это занимает буквально минуту!"
    text_en: "All access details are laid out in the assistant via the link in bio. Takes just a minute!"

  - id: kw_analytics
    keywords: ["аналитик", "точност", "график", "инструмент", "analytics", "charts", "accuracy"]
    emotion: excited
    text_ru: "Аналитика обновляется в реальном времени прямо на экране! Следите за графиком!"
    text_en: "Analytics update in real-time right on the screen! Keep your eyes on the chart!"

  - id: kw_scam
    keywords: ["скам", "развод", "обман", "фейк", "scam", "fake", "fraud"]
    emotion: wink
    text_ru: "Понимаю сомнения! Поэтому эфир открытый и живой — смотрите прямо сейчас, всё прозрачно!"
    text_en: "I hear you! That's why we stream live — watch right now, everything is open and clear!"

  - id: kw_bot
    keywords: ["бот", "bot", "wink", "винк"]
    emotion: happy
    text_ru: "Всё про ассистента — в шапке профиля! Жми ссылку и залетай!"
    text_en: "Everything about the assistant is in the bio! Tap the link and join in!"

# Приветствия новых зрителей (событие входа в эфир).
greetings:
  ru:
    - "Оо, новый зритель у нас! Привет-привет!"
    - "Добро пожаловать к нам на стрим! Располагайся, сейчас будет интересно!"
    - "Привет! Добро пожаловать, устраивайся поудобнее!"
  en:
    - "Oh, welcome to the stream! Hey-hey!"
    - "Welcome, glad you joined! Get comfy, it's about to get good!"
    - "Hi there! Welcome to the stream!"

# Благодарности за подарки.
gift_thanks:
  ru:
    - "Огромное спасибо за подарок!! Ты просто космос!"
    - "Вау, какой крутой подарок! Спасибо огромное, очень приятно!"
    - "Спасибо за подарок! Ты делаешь этот стрим ярче!"
  en:
    - "Huge thanks for the gift!! You're amazing!"
    - "Wow, thank you so much for the gift!"
    - "Thanks for the gift! You make the stream brighter!"

# Фолбэки: LLM недоступен или лимит — общий живой ответ.
fallbacks:
  ru:
    - "Хороший вопрос! Всё по шагам расскажет бот — ссылка в шапке!"
    - "Слышу тебя! Все подробности — в шапке профиля, залетай!"
    - "Отличный вопрос! Смотри на экран — сейчас всё покажу!"
  en:
    - "Great question! The assistant explains everything — link in the bio!"
    - "I hear you! Details are in the bio, hop in!"
    - "Nice one! Watch the screen — I'll show you everything!"
