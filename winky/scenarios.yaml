# ============================================================
# Реплики Winky — редактируйте на ходу, файл перезагрузится сам.
# Формат quick_replies:
#   id: уникальный идентификатор
#   label: название в пульте
#   icon: эмодзи иконка
#   emotion: idle | happy | excited | thinking | wink | wave | win | blush | flirt_kiss | shy
#   texts_ru: список вариантов на русском (выбирается случайно)
#   texts_en: список вариантов на английском (выбирается случайно)
# ============================================================

quick_replies:
  - id: greeting
    label: Приветствие
    icon: 👋
    emotion: wave
    texts_ru:
      - "[wave] Привет-привет всем! Я Винки — ваша неоновая соведущая! Рада всех видеть на стриме, сегодня будет жарко!"
      - "[happy] Хей, чатик, всем огромный приветик! Располагайтесь поудобнее, сегодня ловим самые сочные движения!"
    texts_en:
      - "[wave] Hey everyone! I'm Winky, your stream co-host! Welcome to the stream, we're catching great moves today!"
      - "[happy] Hello friends! Glad to see you all here, make yourself comfortable and watch the screen!"

  - id: how_to_use
    label: Как пользоваться
    icon: 📖
    emotion: thinking
    texts_ru:
      - "[thinking] Всё супер просто: переходишь по ссылочке в шапке профиля, запускаешь бота и следуешь трём шагам на экране! Занимает меньше минуты!"
      - "[wink] Инструкция на самом деле изи: в шапке профиля закреплена прямая ссылка на бота, он всё наглядно покажет по шагам!"
    texts_en:
      - "[thinking] Super easy: tap the link in bio, start the bot and follow 3 simple steps on screen! Takes under a minute!"
      - "[wink] Really straightforward: the link in my profile bio guides you step-by-step through the whole setup!"

  - id: about_stream
    label: О стриме
    icon: 🎥
    emotion: excited
    texts_ru:
      - "[excited] На этом стриме мы тестируем веб-аналитику и смотрим за графиками в реальном времени! Вся статистика прямо перед вами на экране!"
      - "[happy] Проверяем точность алгоритмов прямо в прямом эфире! Следите за свечами и делитесь мыслями в чате!"
    texts_en:
      - "[excited] On this stream we're testing real-time market analytics live! Check out the screen to see how it works!"
      - "[happy] Live testing our algorithms and watching the charts in front of you! Share your thoughts in chat!"

  - id: cta_bio
    label: Ссылка в био
    icon: 🚀
    emotion: happy
    texts_ru:
      - "[wink] Ребятки, не теряйте: ссылка на веб-приложение закреплена прямо в шапке профиля! Заглядывайте!"
      - "[happy] Кстати, доступ к инструментам ждёт вас прямо в шапке моего профиля! Переходите и пробуйте сами!"
    texts_en:
      - "[wink] Friends, don't miss it: the app link is pinned right in my bio! Check it out!"
      - "[happy] Access to the tools is waiting in my profile bio! Tap the link and test it out!"

  - id: ask_in_chat
    label: Вопросы в чат
    icon: 💬
    emotion: wink
    texts_ru:
      - "[wink] Если есть любые вопросы или просто хотите поболтать — пишите прямо в чатик, я всё читаю и с удовольствием отвечу!"
      - "[blush] Не стесняйтесь, пишите в чат! С кем сегодня ещё не успели познакомиться?"
    texts_en:
      - "[wink] Got questions or just want to chat? Drop a comment, I see everything and will gladly reply!"
      - "[blush] Don't be shy, say hi in chat! Who haven't I met yet today?"

  - id: balance_info
    label: О доступе
    icon: ℹ️
    emotion: thinking
    texts_ru:
      - "[thinking] Доступ к веб-приложению совершенно свободный, все подробности расписаны по шагам в боте по ссылке в профиле!"
      - "[happy] Чтобы открыть инструменты, просто выполните пару простых шагов в боте из шапки профиля. Это занимает буквально минуту!"
    texts_en:
      - "[thinking] Access to the tools is super straightforward, check out the step-by-step guide via the link in bio!"
      - "[happy] To open the app, just complete a couple quick steps in the assistant linked in my profile!"

  - id: green_streak
    label: Зелёная серия
    icon: 🔥
    emotion: win
    texts_ru:
      - "[excited] Вау, посмотрите на эту уверенную зеленую свечу! Аналитика отработала как по часам, просто кайф!"
      - "[win] Вот это движение, отличный результат! Кто успел зайти вместе с нами — вы просто красавчики!"
    texts_en:
      - "[excited] Wow, look at that strong green candle! Analytics are right on point today, looking beautiful!"
      - "[win] What a fantastic move on screen! Huge props to everyone watching along!"

  - id: smart_pace
    label: Разумный темп
    icon: 🧠
    emotion: thinking
    texts_ru:
      - "[thinking] Главное на стриме — холодная голова и строгая дисциплина. Никакого азарта и суеты, работаем спокойно и системно!"
      - "[wink] Никогда не спешите и контролируйте эмоции! Тот, кто действует по системе, всегда впереди суеты."
    texts_en:
      - "[thinking] The number one rule is discipline and patience! Stay calm and stick to the plan."
      - "[wink] Never rush, guys! A calm, systematic approach always beats emotional impulse."

  - id: skeptics_reply
    label: Для сомневающихся
    icon: 🛡️
    emotion: wink
    texts_ru:
      - "[wink] Сомневаться — это абсолютно нормально! Поэтому мы и ведём открытый прямой эфир: смотрите своими глазами на экран в реальном времени!"
      - "[happy] Лучшее доказательство — это открытый график и прямая трансляция. Наблюдайте и делайте выводы сами!"
    texts_en:
      - "[wink] It's totally normal to be skeptical! That's why we stream live — watch and see the transparent results for yourself!"
      - "[happy] The best proof is seeing it live right on your screen. Watch, verify, and decide for yourself!"

  - id: thanks_likes
    label: Лайки и поддержка
    icon: ❤️
    emotion: blush
    texts_ru:
      - "[blush] Огромное спасибо за ваши тапы по экранчику и сердечки! Вы невероятные, стрим просто взлетает в топ!"
      - "[excited] Спасибо каждому за лайки! Ваши тапы заряжают стрим космической энергией, жмём дальше!"
    texts_en:
      - "[blush] Thank you so much for the likes and screen taps! You guys are amazing, appreciate the love!"
      - "[excited] Huge thanks for all the hearts! You're making this stream shine so bright!"

# Авто-разогрев и CTA: соотношение 4:1 (4 вопроса к чату на 1 напоминание про ассистента)
cta:
  interval_minutes: 3
  # 4 раза из 5: живой разогрев молчащего чата, вопросы к зрителям, вовлечение
  warmup_ru:
    - "[excited] Ребятки, признавайтесь в чате, кто из какого города или страны смотрит стрим? Напишите!"
    - "[wink] Чат, как думаете, пробьём следующий уровень или сейчас будет отскок? Пишите свои мысли!"
    - "[happy] Кто сегодня уже поймал зелёную свечу вместе с нами — маякните плюсиком в чат!"
    - "[blush] Обожаю эту музыку на фоне! Кому тоже заходит стрим-вайб — накидайте тапов по экранчику! 🥰"
    - "[thinking] Ребят, а кто здесь новенький? Поставьте единички в чат, хочу со всеми познакомиться!"
    - "[excited] Чат, активнее! Давайте добьем следующую красивую цифру лайков прямо сейчас! Вы лучшие!"
  warmup_en:
    - "[excited] Friends, drop your city or country in chat! Where are you watching from?"
    - "[wink] Chat, do you think we will break this level or bounce back? Let me know your thoughts!"
    - "[happy] Who caught the green streak with us today? Drop a plus in chat!"
    - "[blush] Love this music in the background! Double tap the screen if you're enjoying the vibes! 🥰"
    - "[thinking] Any newcomers here today? Type 1 in chat, I want to say hi to you all!"
    - "[excited] Let's tap the screen and hit the next like goal right now! You guys are awesome!"
  # 1 раз из 5: деликатное напоминание про ассистента в шапке профиля
  messages_ru:
    - "[happy] Кстати, ребятки, доступ к нашему веб-приложению ждёт вас прямо в шапке профиля! Не теряйте!"
    - "[wink] Напоминаю: все полезные алгоритмы и наш ассистент закреплены по ссылочке в описании профиля!"
    - "[happy] Хотите протестировать инструменты сами? Заглядывайте по ссылке в шапке профиля, пока идёт стрим!"
  messages_en:
    - "[happy] By the way friends, access to our web analytics is waiting right in the bio! Check it out!"
    - "[wink] Quick reminder: all the tools and our assistant are linked in my profile bio!"
    - "[happy] Want to test the algorithms yourself? Tap the link in bio while the stream is live!"

# Ответы по ключевым словам (приоритетнее LLM при прямых вопросах)
keyword_replies:
  - id: kw_hello
    keywords: ["привет", "хай", "здаров", "добрый", "hello", "hi", "hey", "салют"]
    emotion: happy
    text_ru: "[wave] Привет-привет!! Очень рада видеть тебя на стриме!"
    text_en: "[wave] Hey-hey!! So happy to have you on the stream!"

  - id: kw_howto
    keywords: ["как польз", "как зарег", "как нач", "как попасть", "how to", "how do i", "how can i"]
    emotion: thinking
    text_ru: "[thinking] Всё просто: переходишь по ссылке в шапке профиля, запускаешь бота и следуешь трём коротким шагам. Приложение откроется сразу!"
    text_en: "[thinking] Super simple: tap the link in bio, launch the assistant and follow 3 quick steps. The app opens right away!"

  - id: kw_link
    keywords: ["ссылк", "где бот", "как найти", "link", "where bot", "bio"]
    emotion: excited
    text_ru: "[wink] Ссылка на веб-приложение — прямо в шапке профиля! Заглядывай, пока идёт эфир!"
    text_en: "[wink] The link is right in my bio! Hop in while the stream is live!"

  - id: kw_access
    keywords: ["доступ", "сколько нужно", "как открыть", "access", "how much", "cost"]
    emotion: thinking
    text_ru: "[happy] Все детали по доступу расписаны в боте по ссылке в шапке профиля. Это занимает буквально минуту!"
    text_en: "[happy] All access details are laid out in the assistant via the link in bio. Takes just a minute!"

  - id: kw_analytics
    keywords: ["аналитик", "точност", "график", "инструмент", "analytics", "charts", "accuracy"]
    emotion: excited
    text_ru: "[excited] Аналитика обновляется в реальном времени прямо на экране! Следи за движением графика!"
    text_en: "[excited] Analytics update in real-time right on the screen! Keep your eyes on the chart!"

  - id: kw_scam
    keywords: ["скам", "развод", "лохотрон", "фейк", "scam", "fake", "fraud"]
    emotion: wink
    text_ru: "[wink] Понимаю твои сомнения! Поэтому эфир открытый и живой — смотри прямо сейчас, всё максимально прозрачно!"
    text_en: "[wink] I understand the skepticism! That's why we stream live — watch right now, everything is open and clear!"

  - id: kw_bot
    keywords: ["бот", "bot", "wink", "винк"]
    emotion: happy
    text_ru: "[happy] Всё про нашего ассистента — в шапке профиля! Жми ссылку и присоединяйся!"
    text_en: "[happy] Everything about the assistant is in my bio! Tap the link and join in!"

