<!doctype html><html lang="ru"><meta charset="utf-8"><title>Приёмка сопровождения Winky</title><style>body{max-width:900px;margin:40px auto;padding:20px;background:#10191d;color:#efffff;font:18px system-ui}button{font:inherit;padding:12px;background:#176b59;color:white;border:0;border-radius:8px;margin:8px}audio{width:100%}article{padding:20px;border-bottom:1px solid #427166}pre{white-space:pre-wrap}</style><h1>Сопровождение Winky: два исправленных дубля</h1><p>Банк содержит 160 записей. Эти две замены требуют прослушивания. Автоматическая проверка не оценивает харизму и естественность.</p><main id="list">Загрузка…</main><button id="save" disabled>Сохранить приёмку двух записей</button><p id="status"></p><script>
const heard=new Set();let rows=[];async function load(){try{const m=await(await fetch('manifest.json')).json();rows=Object.values(m.categories).flat().filter(r=>r.requires_listening);document.querySelector('#list').textContent='';for(const r of rows){const article=document.createElement('article');const text=document.createElement('p');text.textContent=r.text;const a=document.createElement('audio');a.controls=true;a.src=r.file;a.onplay=()=>document.querySelectorAll('audio').forEach(other=>{if(other!==a)other.pause()});a.onended=()=>{heard.add(r.id);document.querySelector('#status').textContent=`Прослушано: ${heard.size} / ${rows.length}`;document.querySelector('#save').disabled=heard.size!==rows.length};article.append(text,a);document.querySelector('#list').append(article)}}catch{document.querySelector('#list').textContent='Не удалось загрузить библиотеку.'}}
document.querySelector('#save').onclick=()=>{const approval={method:'owner_sampled',voice_samples_accepted:true,records:rows.map(r=>({id:r.id,sha256:r.sha256,accepted:true}))};const url=URL.createObjectURL(new Blob([JSON.stringify(approval,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='winky-commentary-acceptance.json';link.click();URL.revokeObjectURL(url)};load();
</script></html>
