<!doctype html><html lang="ru"><meta charset="utf-8"><title>Приёмка голоса Winky</title><style>body{background:#0c1718;color:#ecffff;font:18px system-ui;max-width:1000px;margin:40px auto;padding:20px}button,select{font:inherit;padding:10px;margin:5px;background:#174b41;color:white;border:1px solid #39cbaa;border-radius:8px}audio{width:100%}pre{white-space:pre-wrap}.bad{color:#ffb493}.good{color:#77edb9}</style><h1>Приёмка банка Winky — Fish Audio</h1><p>240 записей. Русский — Марин, английский — Venti. ASR и измерения помогают проверке, но не заменяют прослушивание.</p><select id="language"><option value="all">RU и EN</option><option value="ru">RU</option><option value="en">EN</option></select><select id="scope"><option value="retakes" selected>Пять исправленных записей</option><option value="all">Все записи</option><option value="flagged">С замечаниями автоматической проверки</option></select><button id="play">Слушать по порядку</button><button id="stop">Пауза</button><button id="next">Следующая</button><h2 id="title"></h2><p id="progress"></p><audio id="audio" controls></audio><pre id="text"></pre><pre id="qc"></pre><button id="reject">Отметить для замены</button><button id="export">Сохранить результаты прослушивания</button><p id="summary"></p><script>
let records=[],queue=[],index=0,heard=new Set(),rejected=new Set(),running=false,loaded=false;const audio=document.getElementById('audio');const $=id=>document.getElementById(id);
async function load(){try{const m=await(await fetch('manifest.json')).json();records=Object.values(m.categories).flat();let qc=[];try{qc=(await(await fetch('qc.json')).json()).records||[]}catch{}const byid=new Map(qc.map(r=>[r.id,r]));for(const r of records)r.qc=byid.get(r.id)||null;try{const saved=JSON.parse(localStorage.getItem('winky-bank-review')||'[]');for(const r of saved){const current=records.find(x=>x.id===r.id&&x.sha256===r.sha256);if(current){heard.add(r.id);if(!r.accepted)rejected.add(r.id)}}}catch{}loaded=true;filter()}catch{$('text').textContent='Не удалось загрузить манифест. Обновите страницу.'}}
function save(){localStorage.setItem('winky-bank-review',JSON.stringify(records.filter(r=>heard.has(r.id)||rejected.has(r.id)).map(r=>({id:r.id,sha256:r.sha256,accepted:heard.has(r.id)&&!rejected.has(r.id)}))))}
function filter(){audio.pause();running=false;queue=records.filter(r=>($('language').value==='all'||r.lang===$('language').value)&&($('scope').value==='all'||($('scope').value==='retakes'?r.text_version>1:r.qc?.issues?.length)));index=0;show()}
function show(){const r=queue[index];if(!r){$('title').textContent='Просмотр завершён';running=false;return}audio.src=r.file;$('title').textContent=r.id;$('progress').textContent=`${index+1} / ${queue.length} · ${r.duration.toFixed(2)} с`;$('text').textContent='Текст: '+r.text+(r.owner_review?'\nОценка владельца: '+r.owner_review:'');$('qc').textContent=r.qc?'ASR: '+r.qc.transcript+'\nЗамечания: '+(r.qc.issues.join(', ')||'нет'):'Автоматическая проверка ещё выполняется';$('summary').textContent=`Прослушано до конца: ${heard.size}. Отмечено для замены: ${rejected.size}.`;if(running)audio.play().catch(()=>{running=false})}
audio.addEventListener('ended',()=>{heard.add(queue[index].id);save();index++;show()});$('play').onclick=()=>{running=true;audio.play()};$('stop').onclick=()=>{running=false;audio.pause()};$('next').onclick=()=>{audio.pause();index++;show()};$('reject').onclick=()=>{if(queue[index])rejected.add(queue[index].id);save();index++;show()};$('language').onchange=filter;$('scope').onchange=filter;$('export').onclick=()=>{const sampled=$('scope').value==='retakes';const data={method:sampled?'owner_sampled':'owner_listening',voice_samples_accepted:sampled,records:records.filter(r=>heard.has(r.id)).map(r=>({id:r.id,sha256:r.sha256,accepted:!rejected.has(r.id)}))};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='winky-listening-review.json';a.click();URL.revokeObjectURL(a.href)};load();
</script></html>
