<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>LIVE SESSION — Winky Counter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Rajdhani:wght@600;700;800&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #0B0E14;
      color: #F3F4F6;
      font-family: 'Chakra Petch', 'Rajdhani', -apple-system, sans-serif;
      padding: 10px;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .wps-tactical-box {
      position: relative;
    }
    .wps-tactical-box::before, .wps-tactical-box::after {
      content: '';
      position: absolute;
      width: 7px;
      height: 7px;
      pointer-events: none;
      border-color: #FF6B00;
      border-style: solid;
      opacity: 0.85;
      z-index: 5;
    }
    .wps-tactical-box::before {
      top: -1px;
      left: -1px;
      border-width: 2px 0 0 2px;
    }
    .wps-tactical-box::after {
      bottom: -1px;
      right: -1px;
      border-width: 0 2px 2px 0;
    }
    .hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 6px;
    }
    .hud-title-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00FF9D;
      box-shadow: 0 0 8px #00FF9D;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .hud-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #FFFFFF;
      text-transform: uppercase;
    }
    .hud-pair {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 800;
      color: #38BDF8;
      background: rgba(56, 189, 248, 0.12);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }
    .hud-clock {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #64748B;
    }
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 6px 0;
      flex: 1;
    }
    .stat-card {
      background: #10151F;
      border-radius: 8px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .stat-card.wins {
      border-color: rgba(0, 255, 157, 0.35);
      box-shadow: 0 0 16px rgba(0, 255, 157, 0.08) inset;
    }
    .stat-card.losses {
      border-color: rgba(255, 59, 92, 0.35);
      box-shadow: 0 0 16px rgba(255, 59, 92, 0.08) inset;
    }
    .stat-tag {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }
    .stat-card.wins .stat-tag { color: #00FF9D; }
    .stat-card.losses .stat-tag { color: #FF3B5C; }
    .stat-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 36px;
      font-weight: 800;
      line-height: 1;
      margin: 2px 0;
    }
    .stat-card.wins .stat-num {
      color: #00FF9D;
      text-shadow: 0 0 14px rgba(0, 255, 157, 0.45);
    }
    .stat-card.losses .stat-num {
      color: #FF3B5C;
      text-shadow: 0 0 14px rgba(255, 59, 92, 0.45);
    }
    .btn-controls {
      display: flex;
      gap: 6px;
    }
    .btn-step {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #E2E8F0;
      width: 28px;
      height: 22px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .btn-step:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.05);
    }
    .hud-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 6px;
    }
    .winrate-wrap {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .winrate-label {
      font-size: 10px;
      font-weight: 700;
      color: #64748B;
    }
    .winrate-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 800;
      color: #00F0FF;
    }
    .btn-reset {
      background: transparent;
      border: none;
      color: #64748B;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
      padding: 2px 4px;
    }
    .btn-reset:hover {
      color: #FF3B5C;
    }
  </style>
</head>
<body class="wps-tactical-box">
  <header class="hud-header">
    <div class="hud-title-wrap">
      <span class="pulse-dot"></span>
      <span class="hud-title">⋮⋮ ● LIVE SESSION</span>
    </div>
    <span class="hud-pair" id="hudPair">USD/CAD OTC</span>
    <span class="hud-clock" id="hudClock">19:15:58 UTC</span>
  </header>

  <div class="stats-row">
    <!-- WINS CARD -->
    <div class="stat-card wins wps-tactical-box">
      <span class="stat-tag">WINS</span>
      <span class="stat-num" id="winsNum">110</span>
      <div class="btn-controls">
        <button type="button" class="btn-step" id="btnWinsMinus">-</button>
        <button type="button" class="btn-step" id="btnWinsPlus">+</button>
      </div>
    </div>

    <!-- LOSSES CARD -->
    <div class="stat-card losses wps-tactical-box">
      <span class="stat-tag">LOSSES</span>
      <span class="stat-num" id="lossesNum">1</span>
      <div class="btn-controls">
        <button type="button" class="btn-step" id="btnLossesMinus">-</button>
        <button type="button" class="btn-step" id="btnLossesPlus">+</button>
      </div>
    </div>
  </div>

  <footer class="hud-footer">
    <div class="winrate-wrap">
      <span class="winrate-label">WINRATE:</span>
      <span class="winrate-val" id="winrateNum">99.1%</span>
    </div>
    <button type="button" class="btn-reset" id="btnReset">[Reset]</button>
  </footer>

  <script>
    (function () {
      const state = {
        wins: 110,
        losses: 1,
        pair: 'USD/CAD OTC',
      };

      const winsEl = document.getElementById('winsNum');
      const lossesEl = document.getElementById('lossesNum');
      const winrateEl = document.getElementById('winrateNum');
      const pairEl = document.getElementById('hudPair');
      const clockEl = document.getElementById('hudClock');

      function updateUI() {
        winsEl.textContent = state.wins;
        lossesEl.textContent = state.losses;
        const total = state.wins + state.losses;
        const rate = total > 0 ? ((state.wins / total) * 100).toFixed(1) + '%' : '0.0%';
        winrateEl.textContent = rate;
        if (state.pair) pairEl.textContent = state.pair;
      }

      function broadcast(source) {
        updateUI();
        try {
          localStorage.setItem('winky_live_stats', JSON.stringify({
            wins: state.wins,
            losses: state.losses,
            pair: state.pair,
            timestamp: Date.now()
          }));
        } catch (_) {}

        if (window.BroadcastChannel) {
          try {
            const bc = new BroadcastChannel('winky_live_stats');
            bc.postMessage({
              type: 'STATS_UPDATE',
              wins: state.wins,
              losses: state.losses,
              pair: state.pair,
              source: source || 'counter'
            });
            bc.close();
          } catch (_) {}
        }

        fetch('/api/live_stats', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ wins: state.wins, losses: state.losses, pair: state.pair })
        }).catch(function () {});
      }

      function loadInitial() {
        try {
          const raw = localStorage.getItem('winky_live_stats');
          if (raw) {
            const parsed = JSON.parse(raw);
            if (typeof parsed.wins === 'number') state.wins = parsed.wins;
            if (typeof parsed.losses === 'number') state.losses = parsed.losses;
            if (parsed.pair) state.pair = parsed.pair;
          }
        } catch (_) {}

        fetch('/api/live_stats')
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (data && typeof data.wins === 'number') {
              state.wins = data.wins;
              state.losses = data.losses;
              if (data.pair) state.pair = data.pair;
              updateUI();
            }
          })
          .catch(function () {});

        updateUI();
      }

      document.getElementById('btnWinsPlus').addEventListener('click', function () {
        state.wins += 1;
        broadcast('counter');
      });
      document.getElementById('btnWinsMinus').addEventListener('click', function () {
        state.wins = Math.max(0, state.wins - 1);
        broadcast('counter');
      });
      document.getElementById('btnLossesPlus').addEventListener('click', function () {
        state.losses += 1;
        broadcast('counter');
      });
      document.getElementById('btnLossesMinus').addEventListener('click', function () {
        state.losses = Math.max(0, state.losses - 1);
        broadcast('counter');
      });
      document.getElementById('btnReset').addEventListener('click', function () {
        state.wins = 110;
        state.losses = 1;
        broadcast('counter');
      });

      if (window.BroadcastChannel) {
        try {
          const rxChannel = new BroadcastChannel('winky_live_stats');
          rxChannel.onmessage = function (ev) {
            const msg = ev.data;
            if (!msg) return;
            if (typeof msg.wins === 'number') state.wins = msg.wins;
            if (typeof msg.losses === 'number') state.losses = msg.losses;
            if (msg.pair) state.pair = msg.pair;
            updateUI();
          };
        } catch (_) {}
      }

      function tickClock() {
        const now = new Date();
        const h = String(now.getUTCHours()).padStart(2, '0');
        const m = String(now.getUTCMinutes()).padStart(2, '0');
        const s = String(now.getUTCSeconds()).padStart(2, '0');
        clockEl.textContent = h + ':' + m + ':' + s + ' UTC';
      }
      setInterval(tickClock, 1000);
      tickClock();

      loadInitial();
    })();
  </script>
</body>
</html>
